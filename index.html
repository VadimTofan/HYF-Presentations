<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="JavaScript workshop presentations for HackYourFuture."
    />
    <title>Presentations · HackYourFuture</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #0b1020;
        --surface: #131a2d;
        --border: #30405e;
        --text: #f3f7ff;
        --muted: #a6b2ca;
        --yellow: #f7df1e;
      }

      .page {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--text);
        font-family: 'Trebuchet MS', 'Aptos', sans-serif;
      }

      .library {
        max-width: 46rem;
        margin: 0 auto;
        padding: clamp(1.5rem, 6vw, 4rem);
      }

      .library__label {
        color: var(--yellow);
        font-family: 'Cascadia Code', Consolas, monospace;
        font-size: 0.875rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .library__title {
        margin: 1rem 0;
        font-size: clamp(2.5rem, 8vw, 4rem);
      }

      .library__intro {
        margin: 0 0 2.5rem;
        color: var(--muted);
        line-height: 1.6;
      }

      .library__list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .library__link {
        display: block;
        padding: 1.5rem;
        border: 0.0625rem solid var(--border);
        border-left: 0.25rem solid var(--yellow);
        background: var(--surface);
        color: var(--text);
        font-size: 1.25rem;
        line-height: 1.5;
        text-decoration: none;
      }

      .library__link:hover {
        border-color: var(--yellow);
      }

      .library__link:focus-visible {
        outline: 0.1875rem solid var(--yellow);
        outline-offset: 0.25rem;
      }
    </style>
  </head>
  <body class="page">
    <main class="library">
      <p class="library__label">HackYourFuture</p>
      <h1 class="library__title">Presentations</h1>
      <p class="library__intro">Choose a workshop presentation to open.</p>

      <nav aria-label="Workshop presentations">
        <ul class="library__list">
          <li>
            <a class="library__link" href="intro-to-javascript-week1/">
              Intro to JavaScript · Week 1
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
